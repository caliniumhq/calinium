name: Public validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-validation:
    name: Public validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/dashboard/package-lock.json

      - name: Install root dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install dashboard dependencies without lifecycle scripts
        run: npm --prefix apps/dashboard ci --ignore-scripts

      - name: Run credential-free public validation
        env:
          CALINIUM_SHOPIFY_CLI: ./scripts/run-shopify-cli-node20.mjs
        run: npm run validate:public
